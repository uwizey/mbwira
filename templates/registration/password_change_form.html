{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h4 mb-3">Change password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="btn btn-dark mt-3" type="submit">Save</button>
    </form>
  </div>
</div>
{% endblock %}
