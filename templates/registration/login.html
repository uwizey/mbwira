{% extends "base.html" %}
{% block title %}Log in · Mbwira{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="row justify-content-center w-100">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <div class="auth-brand">Mbwira<span>.</span></div>
        <p class="text-muted mb-0">Incident and IT asset management</p>
      </div>
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h5 mb-3">Sign in to your workspace</h1>
          <form method="post">
            {% csrf_token %}
            {% if form.errors %}
              <div class="alert alert-danger py-2">Wrong email or password.</div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label" for="id_username">Email</label>
              <input type="email" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="id_password">Password</label>
              <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Log in</button>
          </form>
        </div>
            <p class="text-center small text-muted mt-3">New here? <a href="{% url 'organizations:signup' %}">Register your organization</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
