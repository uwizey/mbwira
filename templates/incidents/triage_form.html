{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Triage {{ incident.reference }} · Mbwira{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Triage {{ incident.reference }}</h1>
        <p class="text-muted">{{ incident.title }}</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save triage</button>
            <a class="btn btn-outline-primary" href="{{ incident.get_absolute_url }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
