{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Report an incident · Mbwira{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Report an incident or failure</h1>
        <p class="text-muted small">Your IT and security team will review it, set its priority and assign it.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Submit report</button>
            <a class="btn btn-outline-primary" href="{% url 'incidents:mine' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
